name: build-android

# Builds the Theft4 / LibertyRecomp Android APK (arm64-v8a) on every push.
#
# No game files are needed at build time: LIBERTY_RECOMP_ANDROID_RUNTIME_ASSETS=ON
# (set in os/android/app/build.gradle.kts) makes the app request the game
# folder from the user at runtime via the in-app picker. Do NOT add any
# default.xex / *.rpf to this repository — they are copyrighted.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize pinned dependencies (submodules + patches)
        run: |
          python3 tools/setup_repo.py --jobs 8

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle distribution (~/.gradle/wrapper) and dependency
      # caches (~/.gradle/caches) so later runs are resilient to transient
      # network flakiness on services.gradle.org / dl.google.com.
      #
      # validate-wrappers is disabled because the SDL submodules vendored in
      # thirdparty/SDL and glue/rexglue-sdk-main ship their own
      # android-project gradle-wrapper.jar builds whose checksums are not in
      # the official wrapper checksum database. Those wrappers are never
      # executed by this workflow; the only wrapper we run (os/android) was
      # verified byte-identical to the official Gradle 8.11.1 one.
      - name: Set up Gradle (distribution + dependency caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Ensure NDK 27.2.12479018
        run: |
          NDK_VER=27.2.12479018
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" >/dev/null
          fi
          echo "Installed NDKs:"; ls "$ANDROID_HOME/ndk"

      - name: Ensure SDK CMake >= 3.29
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.31.1" \
            || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.30.4" \
            || true
          echo "Installed CMake versions:"; ls "$ANDROID_HOME/cmake"

      # Pre-download the Gradle distribution with retries. Build #4 died here
      # with 'java.net.SocketException: Connection reset' during the wrapper
      # download; this makes the step self-healing.
      - name: Warm up Gradle wrapper (retry on transient network errors)
        working-directory: os/android
        run: |
          chmod +x gradlew
          ok=0
          for i in 1 2 3 4 5; do
            if ./gradlew --version >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "::warning::Gradle wrapper download attempt ${i} failed (likely transient network error); retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Could not download the Gradle distribution after 5 attempts"
            exit 1
          fi
          ./gradlew --version

      - name: Build release APK (debug-signed fallback)
        working-directory: os/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          set -o pipefail
          chmod +x gradlew
          # The BIN2C code generator (scripts/file_to_c.py) needs a zstd
          # backend when it regenerates embedded assets during the build.
          python3 -m pip install --quiet zstandard || sudo apt-get install -y -q zstd || true
          LOG="$(mktemp)"
          if ./gradlew assembleRelease --stacktrace 2>&1 | tee "$LOG"; then
            exit 0
          fi
          echo "::warning::assembleRelease failed on attempt 1 - checking for transient network errors"
          if grep -qiE 'Connection reset|SocketException|UnknownHost|Could not GET|Could not resolve|Read timed out|timed out|Failed to connect|Connection refused' "$LOG"; then
            echo "::warning::Transient network failure detected - retrying once after 30s"
            sleep 30
            if ./gradlew assembleRelease --stacktrace 2>&1 | tee -a "$LOG"; then
              echo "::notice::assembleRelease succeeded on attempt 2"
              exit 0
            fi
            echo "::error::assembleRelease failed on attempt 2 as well"
            exit 1
          fi
          echo "::error::assembleRelease failed with a non-transient error"
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-Android-APK
          path: os/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
